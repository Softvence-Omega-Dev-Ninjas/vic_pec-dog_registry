services:
    app:
        image: softvence/vic_pec-dog_registry:latest
        container_name: vic_pec-dog_registry
        profiles:
            - prod
        platform: linux/amd64
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "${PORT}:${PORT}"
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    db:
        image: postgres:16-alpine
        container_name: vic_pec-dog_registry_pg
        profiles:
            - dev
            - prod
        environment:
            - POSTGRES_USER=${PG_USERNAME}
            - POSTGRES_PASSWORD=${PG_PASSWORD}
            - POSTGRES_DB=${PG_DATABASE}
            - PGDATA=/var/lib/postgresql/data/pgdata
        volumes:
            - vic_pec-dog_registry_pg-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${PG_USERNAME} -d ${PG_DATABASE}"]
            interval: 10s
            timeout: 5s
            retries: 5

        restart: unless-stopped

volumes:
    vic_pec-dog_registry_pg-data:
        driver: local

networks:
    vic_pec-dog_registry:
